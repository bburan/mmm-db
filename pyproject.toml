[project]
name = "mmm-db"
description = "Supports colony db data files"
readme = "README.md"
requires-python = ">=3.7"
license = {file = "license.txt"}
authors = [
    {name = "Brad Buran", email="buran@ohsu.edu"},
]
maintainers = [
    {name = "Brad Buran", email="buran@ohsu.edu"},
]
dependencies = [
    'cochleogram[lif,czi]',
    'psidata>=0.1.13',
    'cftsdata[zarr]>=0.1.9',
    'abtsdata>=0.0.2',
    'abr',
    'pymupdf',
    'plotly',
    'bokeh',
    'h5py',
]
dynamic = ["version"]

[build-system]
requires = ["setuptools>=61.2", "wheel", "setuptools_scm[toml]>=3.4.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/mmm_db/version.py"

[tool.setuptools.packages.find]
where = ["src"]

# Help topics contributed to colony-manager (mmm_db.helptopics) are
# Markdown files, not modules, so they need declaring to ship in a
# built wheel. The deployment installs editable, where this is moot.
[tool.setuptools.package-data]
mmm_db = ["help/*.md"]
